name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run tool/patch_android.dart
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk smart-traffic.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Smart Traffic (latest)
          files: smart-traffic.apk